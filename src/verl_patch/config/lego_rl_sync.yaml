# Hydra config for Harbor harness-native online RL training.

hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer       # verl base PPO config
  - _self_

# ---------------------------------------------------------------------------
# vLLM generation is reached through the shared in-process harness proxy.
# ---------------------------------------------------------------------------
actor_rollout_ref:
  rollout:
    name: vllm
    mode: async
    val_kwargs:
      do_sample: True
    engine_kwargs:
      vllm:
        # Must match SERVED_MODEL_NAME used by the selected harness.
        served-model-name: ${oc.env:SERVED_MODEL_NAME,vllm_model}
        enable-expert-parallel: True
        enable-auto-tool-choice: True
        # Single source of truth: TOOL_CALL_PARSER drives BOTH this vLLM
        # serving parser and the agent-loop config's top-level tool_parser.
        tool-call-parser: ${oc.env:TOOL_CALL_PARSER,qwen3_coder}
        attention-config.backend: FLASH_ATTN
    agent:
      num_workers: 8
      default_agent_loop: "builtin_swe_agent"
      agent_loop_config_path: ${oc.env:AGENT_LOOP_CONFIG_PATH,${oc.env:LEGO_RL_ROOT,${oc.env:SWE_LEGO_RL_ROOT}}/src/verl_patch/config/agent_loop_config_oh.yaml}

fireworks:
  deployment_id: null
  model_id_prefix: test-model
  concurrency: 32

trainer:
  log_episodes: false
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}
